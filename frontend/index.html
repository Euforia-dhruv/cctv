<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RetailVision AI</title>
<link rel="stylesheet" href="/static/styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230B6B55'/%3E%3Ctext x='16' y='22' font-size='16' font-weight='700' text-anchor='middle' fill='white' font-family='sans-serif'%3ER%3C/text%3E%3C/svg%3E">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Primary">
    <div class="brand">
      <div class="brand-mark">R</div>
      <div>
        <div class="brand-name">RetailVision</div>
        <div class="brand-sub">AI</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot" id="sidebarFoot"></div>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div id="breadcrumb"></div>
      <div class="spacer"></div>
      <div style="position:relative">
        <button class="icon-btn" id="bellBtn" aria-label="Notifications">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          <span class="dot" id="bellDot" style="display:none"></span>
        </button>
        <div class="popover" id="bellPop" style="display:none"></div>
      </div>
      <div class="userchip" id="userChip"></div>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>
<div id="overlay" style="display:none; position:fixed; inset:0; background:rgba(14,27,26,.4); z-index:45;" onclick="document.getElementById('bellPop').style.display='none'"></div>
<script src="/static/env.js"></script>
<script src="/static/vendor/chart.umd.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
